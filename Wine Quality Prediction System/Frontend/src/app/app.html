<div class="app-layout">
  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button
        type="button"
        class="menu-toggle-btn"
        (click)="toggleMobileNav()"
        aria-label="Toggle navigation menu"
        [attr.aria-expanded]="isMobileNavOpen"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a routerLink="/dashboard" class="brand-link" (click)="closeMobileNav()">
        <span class="brand-icon-wrapper" aria-hidden="true">
          <!-- Stylized Wine Glass / AI Diamond SVG -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 22h8"></path>
            <path d="M12 15v7"></path>
            <path d="M12 15a5 5 0 0 0 5-5V3H7v7a5 5 0 0 0 5 5z"></path>
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-title">VinoSense <span class="brand-ai">AI</span></span>
          <span class="brand-subtitle">Wine Quality Prediction</span>
        </div>
      </a>
    </div>

    <div class="topbar-right"></div>
  </header>

  <div class="app-body">
    <!-- Backdrop for mobile drawer -->
    <div
      class="mobile-backdrop"
      [class.active]="isMobileNavOpen"
      (click)="closeMobileNav()"
      aria-hidden="true"
    ></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" [class.mobile-open]="isMobileNavOpen">
      <nav class="sidebar-nav" aria-label="Main Navigation">
        <div class="nav-section-title">Navigation</div>

        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          class="nav-item"
          (click)="closeMobileNav()"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </a>

        <a
          routerLink="/prediction"
          routerLinkActive="active"
          class="nav-item"
          (click)="closeMobileNav()"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </span>
          <span class="nav-label">Predict Quality</span>
        </a>

        <a
          routerLink="/analytics"
          routerLinkActive="active"
          class="nav-item"
          (click)="closeMobileNav()"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </span>
          <span class="nav-label">Model Analytics</span>
        </a>

        <a
          routerLink="/history"
          routerLinkActive="active"
          class="nav-item"
          (click)="closeMobileNav()"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </span>
          <span class="nav-label">Evaluation History</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="system-meta-box">
          <span class="meta-title">ML Pipeline Active</span>
          <span class="meta-desc">UCI Red Wine Benchmark</span>
        </div>
      </div>
    </aside>

    <!-- Main View Outlet Container -->
    <main class="main-content" id="main-content">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>

      <footer class="app-footer">
        <div class="footer-content">
          <span>VinoSense AI &bull; Machine Learning Wine Quality Prediction System</span>
        </div>
      </footer>
    </main>
  </div>
</div>
