<div class="empty-state-container">
  <div class="empty-icon-wrapper" aria-hidden="true">
    <!-- Minimal, restrained wine cellar icon -->
    <svg *ngIf="icon === 'wine'" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 22h8"></path>
      <path d="M12 15v7"></path>
      <path d="M12 15a5 5 0 0 0 5-5V3H7v7a5 5 0 0 0 5 5z"></path>
    </svg>
    <svg *ngIf="icon === 'analytics'" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </svg>
    <svg *ngIf="icon === 'history' || !icon" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
  </div>

  <h3 class="empty-title">{{ title }}</h3>
  <p class="empty-description">{{ description }}</p>

  <button
    *ngIf="actionText"
    type="button"
    class="empty-action-btn"
    (click)="actionClicked.emit()"
  >
    {{ actionText }}
  </button>

  <div class="custom-content">
    <ng-content></ng-content>
  </div>
</div>
